regions:
  - ap-southeast-1
filters:
  tag:Project: devops-bootcamp
  instance-state-name: running
hostnames:
  - instance-id
keyed_groups:
  - key: tags.Role
    prefix: role
compose:
  ansible_host: instance_id
  ansible_connection: "'amazon.aws.aws_ssm'"
