name: Deploy With Ansible Controller

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "App image tag to deploy"
        required: false
        default: "latest"

env:
  AWS_REGION: ap-southeast-1
  REPO_URL: https://github.com/mhadiyahya/devops-bootcamp-project.git

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read Terraform outputs
        id: tf
        working-directory: terraform/envs/prod
        run: |
          terraform init
          echo "controller_instance_id=$(terraform output -raw controller_instance_id)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "ansible_ssm_bucket=$(terraform output -raw ansible_ssm_bucket)" >> "$GITHUB_OUTPUT"

      - name: Run Ansible from controller through SSM
        env:
          CONTROLLER_INSTANCE_ID: ${{ steps.tf.outputs.controller_instance_id }}
          ECR_REPOSITORY_URL: ${{ steps.tf.outputs.ecr_repository_url }}
          ANSIBLE_SSM_BUCKET: ${{ steps.tf.outputs.ansible_ssm_bucket }}
          APP_IMAGE_TAG: ${{ inputs.image_tag }}
          ANSIBLE_LIMIT: all
        run: |
          cat > commands.json <<EOF
          {
            "commands": [
              "set -eu",
              "if ! command -v session-manager-plugin >/dev/null 2>&1; then curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/session-manager-plugin.deb && sudo dpkg -i /tmp/session-manager-plugin.deb; fi",
              "sudo -u ubuntu bash -lc 'rm -rf ~/devops-bootcamp-project && git clone ${REPO_URL} ~/devops-bootcamp-project'",
              "sudo -u ubuntu bash -lc 'cd ~/devops-bootcamp-project && ansible-galaxy install -r ansible/requirements.yml --force'",
              "sudo -u ubuntu bash -lc 'mkdir -p ~/devops-bootcamp-project/ansible/group_vars/all'",
              "sudo -u ubuntu bash -lc 'cat > ~/devops-bootcamp-project/ansible/group_vars/all/terraform_outputs.yml <<VARS\n---\necr_repository_url: \"${ECR_REPOSITORY_URL}\"\nansible_ssm_bucket: \"${ANSIBLE_SSM_BUCKET}\"\napp_image_tag: \"${APP_IMAGE_TAG}\"\nVARS'",
              "sudo -u ubuntu bash -lc 'cd ~/devops-bootcamp-project/ansible && ansible-playbook playbooks/site.yml --limit ${ANSIBLE_LIMIT}'"
            ]
          }
          EOF

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$CONTROLLER_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy devops bootcamp app and monitoring" \
            --parameters file://commands.json \
            --query Command.CommandId \
            --output text)"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$CONTROLLER_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$CONTROLLER_INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
